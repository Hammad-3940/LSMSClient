<div class="login-shell">

  <!-- Left panel -->
  <div class="login-left">
    <div class="login-brand">
      <div class="login-brand-mark"><i class="ti ti-plant-2"></i></div>
      <div>
        <div class="login-brand-name">PasturePro</div>
        <div class="login-brand-sub">Livestock manager</div>
      </div>
    </div>

    <div class="login-hero">
      <h1 class="login-headline">Manage your<br>herd smarter</h1>
      <p class="login-tagline">Track animals, health records, sales and more — all in one place.</p>
    </div>

    <div class="login-stats">
      <div class="login-stat">
        <div class="login-stat-value">2.4k+</div>
        <div class="login-stat-label">Animals tracked</div>
      </div>
      <div class="login-stat-divider"></div>
      <div class="login-stat">
        <div class="login-stat-value">98%</div>
        <div class="login-stat-label">Uptime</div>
      </div>
      <div class="login-stat-divider"></div>
      <div class="login-stat">
        <div class="login-stat-value">500+</div>
        <div class="login-stat-label">Farms</div>
      </div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="login-right">
    <div class="login-card">

      <div class="login-card-header">
        <h2 class="login-title">Welcome back</h2>
        <p class="login-subtitle">Sign in to your farm account</p>
      </div>

      <div class="login-form">

        <div class="login-field">
          <label>Email address</label>
          <div class="login-input-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="login-field">
          <div class="login-field-head">
            <label>Password</label>
            <a (click)="navigateToForgotPassword()" class="login-forgot cursor-pointer">Forgot password?</a>
          </div>
          <div class="login-input-wrap">
            <i class="ti ti-lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••">
            <button class="login-eye" type="button" (click)="showPassword = !showPassword">
              <i class="ti" [ngClass]="showPassword ? 'ti-eye' : 'ti-eye-off'"></i>
            </button>
          </div>
        </div>

        <div class="login-remember">
          <label class="login-checkbox">
            <input type="checkbox">
            <span class="login-checkmark"></span>
            Remember me
          </label>
        </div>

        <button class="login-btn" (click)="login()">
          <i class="ti ti-login"></i>
          Sign in
        </button>
      </div>
    </div>
  </div>

</div>
